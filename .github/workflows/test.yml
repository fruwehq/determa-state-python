name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    name: Build and install distribution (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel into a clean environment and exercise packaged API
        run: |
          python -m venv "$RUNNER_TEMP/package-install"
          "$RUNNER_TEMP/package-install/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-install/bin/python" -I - <<'PY'
          import importlib.metadata
          import pathlib
          import sys
          import determa.state
          from determa.state import RuntimeProviderRegistry, SourceClosure, load_bundle
          assert importlib.metadata.version("determa-state") == "0.3.0"
          assert pathlib.Path(determa.state.__file__).is_relative_to(sys.prefix)
          bundle = load_bundle("format: 1\nnamespace: package.smoke\nevents: {}\nmachines:\n  - machine_id: smoke\n    root: {type: simple}\n")
          assert bundle.fingerprint.startswith("sha256:")
          assert RuntimeProviderRegistry is not None and SourceClosure is not None
          PY
          "$RUNNER_TEMP/package-install/bin/determa-state" --version

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned conformance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fruwehq/determa-state-conformance
          ref: 7f09321fb483a22eb677a4342f8d9537a7a18e82
          path: .pinned/determa-state-conformance
      - name: Check out pinned specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fruwehq/determa-state-spec
          ref: 86bb88dd21cb1f799eefe5020b6e49dabf6e7225
          path: .pinned/determa-state-spec
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/determa
      - name: Unit tests
        env:
          DETERMA_CONFORMANCE_DIR: ${{ github.workspace }}/.pinned/determa-state-conformance
          DETERMA_SPEC_DIR: ${{ github.workspace }}/.pinned/determa-state-spec
        run: pytest -q

  python-311-compatibility:
    name: Python 3.11 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned conformance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fruwehq/determa-state-conformance
          ref: 7f09321fb483a22eb677a4342f8d9537a7a18e82
          path: .pinned/determa-state-conformance
      - name: Check out pinned specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fruwehq/determa-state-spec
          ref: 86bb88dd21cb1f799eefe5020b6e49dabf6e7225
          path: .pinned/determa-state-spec
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/determa
      - name: Unit tests
        env:
          DETERMA_CONFORMANCE_DIR: ${{ github.workspace }}/.pinned/determa-state-conformance
          DETERMA_SPEC_DIR: ${{ github.workspace }}/.pinned/determa-state-spec
        run: pytest -q

  conformance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned conformance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fruwehq/determa-state-conformance
          ref: 7f09321fb483a22eb677a4342f8d9537a7a18e82
          path: .pinned/determa-state-conformance
      - name: Check out pinned specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fruwehq/determa-state-spec
          ref: 86bb88dd21cb1f799eefe5020b6e49dabf6e7225
          path: .pinned/determa-state-spec
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Install pinned conformance validator dependencies
        run: python -m pip install -r .pinned/determa-state-conformance/scripts/validation-requirements.txt
      - name: Conformance suite
        env:
          DETERMA_CONFORMANCE_DIR: ${{ github.workspace }}/.pinned/determa-state-conformance
          DETERMA_SPEC_DIR: ${{ github.workspace }}/.pinned/determa-state-spec
        run: |
          pytest conformance -q
          PYTHONPATH=src python "$DETERMA_CONFORMANCE_DIR/scripts/run_host_authority_profile.py" \
            --spec-root "$DETERMA_SPEC_DIR" \
            --adapter python conformance/authority_adapter.py
          PYTHONPATH=src python "$DETERMA_CONFORMANCE_DIR/scripts/run_committed_native_effects_profile.py" \
            --spec-root "$DETERMA_SPEC_DIR" \
            --adapter "python conformance/effects_adapter.py" \
            --authority-adapter "python conformance/authority_adapter.py --worker"

  postgresql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: determa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d determa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e '.[dev,postgresql]'
      - name: PostgreSQL adapter tests
        env:
          DETERMA_POSTGRESQL_DSN: postgresql://postgres:postgres@localhost:5432/determa_test
        run: pytest tests/test_postgresql_store.py tests/test_application_projection_postgresql.py -q
